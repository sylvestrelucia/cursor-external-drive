name: Question
description: Ask about setup, external drives, or migration
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: macOS version, drive type, what you've tried (README FAQ / troubleshooting)
    validations:
      required: false
